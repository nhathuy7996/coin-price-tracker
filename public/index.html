<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Price Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
    }

    .container {
      width: 300px;
      height: 150px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      padding: 20px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .controls {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .control-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .close-btn {
      background: #ff5f57;
    }

    .minimize-btn {
      background: #ffbd2e;
    }

    .settings-btn {
      background: #28ca42;
    }

    .control-btn:hover {
      opacity: 0.8;
      transform: scale(1.1);
    }

    .coin-symbol {
      font-size: 14px;
      font-weight: 600;
      opacity: 0.9;
      -webkit-app-region: no-drag;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .coin-symbol:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .price-display {
      position: relative;
      z-index: 1;
      margin-bottom: 15px;
    }

    .price {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .change {
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .change.positive {
      color: #4ade80;
    }

    .change.negative {
      color: #f87171;
    }

    .footer {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      opacity: 0.8;
    }

    .settings-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 32, 44, 0.98);
      border-radius: 15px;
      padding: 15px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
      overflow: visible;
    }

    .settings-panel.active {
      display: flex;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .settings-title {
      font-size: 16px;
      font-weight: 600;
    }

    .close-settings {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: no-drag;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-label {
      font-size: 12px;
      opacity: 0.8;
    }

    .setting-input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      font-size: 14px;
      -webkit-app-region: no-drag;
    }

    .setting-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.4);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      -webkit-app-region: no-drag;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
    }

    .opacity-value {
      font-size: 12px;
      text-align: right;
    }

    .loading {
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="controls">
        <button class="control-btn close-btn" id="closeBtn" title="Close">×</button>
        <button class="control-btn minimize-btn" id="minimizeBtn" title="Minimize">−</button>
        <button class="control-btn settings-btn" id="settingsBtn" title="Settings">⚙</button>
      </div>
      <div class="coin-symbol" id="coinSymbol">BTC</div>
    </div>

    <div class="price-display">
      <div class="price" id="price">$0.00</div>
      <div class="change" id="change">
        <span id="changeValue">+0.00%</span>
      </div>
    </div>

    <div class="footer">
      <span id="lastUpdate">Loading...</span>
      <span>💰</span>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
